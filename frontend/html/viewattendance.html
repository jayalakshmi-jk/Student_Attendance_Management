<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/css/viewattendance.css">
</head>

<body>
    <nav class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            Student Management System
        </div>

        <a href="/frontend/html/index.html" class="active">Dashboard</a>
        <a href="/frontend/html/addstudent.html">Add Student </a>
        <a href="/frontend/html/markAttendance.html">Mark Attendance </a>
        <a href="/frontend/html/viewattendance.html">View Attendance </a>
        <a href="/frontend/html/login.html">Log Out </a>
    </nav>

    <h1>Attendance</h1>

    <div class="table">
        <input type="text" id="search" placeholder="search studnt..">

        <table>

            <thead>

                <tr>
                    <th>Register No.</th>
                    <th>Roll No.</th>
                    <th>Student Name</th>
                    <th>Class Group</th>
                    <th>Attendance Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>


            </tbody>

        </table>

    </div>

    <form id="edit-form">
        <h2>Change the Attendance</h2>
        <label for="status">Attendance Status: </label><br>
        <select id="status" required>
            <option value="CHECK IN">CHECK IN</option>
            <option value="CHECK OUT">CHECK OUT</option>
        </select>
        <button type="submit">Edit</button>
        <button type="button" id="cancel-edit">Cancel</button>
    </form>

    <script src="/frontend/js/viewattendance.js"></script>
</body>

</html>
